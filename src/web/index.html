<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141824">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arena Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body data-mode="title">
<div id="boot"><b>ARENA MANAGER</b><i></i><span>LÄDT…</span></div>
<div id="app">
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="topbtns"><button id="btnSpeed" class="mini">1X</button><button id="btnPause" class="mini">II</button><button id="btnSound" class="mini">♪</button></div>
  </div>
  <div id="panel">
    <div id="cards"></div>
    <div id="tactics"></div>
    <div id="tipbar"></div>
    <div id="focusrow"><span class="fl">FOKUS</span><div id="focusbar"><i id="focusfill"></i></div><b id="focusval">40</b></div>
    <div id="moves"></div>
    <div id="cmds3">
      <button id="btnShield" class="cmd c4 sh">SCHILD</button>
      <button id="btnBuff" class="cmd c4 bf">ANFEUERN</button>
      <button id="btnDodge" class="cmd c4 dg">AUSWEICHEN</button>
    </div>
    <div id="cmds"><button id="btnPotion" class="cmd it">TRANK</button><button id="btnSuper" class="cmd it super">SUPER</button><button id="btnFocus" class="cmd it fo">FOKUS</button><button id="btnElixir" class="cmd it el">ELIXIER</button></div>
  </div>
  <div id="screens"></div>
</div>
<script>/*JS*/</script>
</body>
</html>
