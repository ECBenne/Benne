<title>Taschenfarm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: ein Dorf auf einem Bildschirm (wie ein Pokémon-Overworld). Oben die Kasse, unten das Steuerkreuz.
   Gebäude öffnen Vollbild-Ansichten: Schacht (Idle Miner), Raids (Clash), Höhle (Roguelike). Bewusst nur ein Look: sonnig. */
:root{
  --sky:#d9f1ff; --sky-top:#8fd6ff; --ink:#14304a; --muted:#4d6b84; --line:#bfdcee;
  --card:#ffffff; --sun:#ffc933; --sun-deep:#f59e0b; --sun-ink:#3d2a00; --good:#1b8a45; --good-deep:#0f5f2d; --hp:#3fbf5f; --hp-low:#e5483a; --bad:#c8321f;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky);background-image:linear-gradient(var(--sky-top),var(--sky) 480px);color:var(--ink);font:16px/1.4 var(--body);overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky-top);z-index:60}
h1,h2,h3{font-family:var(--display);margin:0}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{cursor:default}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.num{font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:6px 10px;font:500 .8rem var(--body)}

#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.hud{margin-top:env(safe-area-inset-top,0px);position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:0 0 16px 16px}
.hud.boost{background:rgba(255,236,170,.95);border-color:var(--sun-deep)}
.res{display:flex;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.res div{font:700 1.05rem var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.res small{display:block;font:500 .68rem var(--body);color:var(--muted)}
#boost{flex:none;border:0;border-radius:11px;padding:7px 10px;font:600 .78rem/1.15 var(--body);background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-deep);display:flex;flex-direction:column;align-items:center;min-width:92px;font-variant-numeric:tabular-nums}
#boost:disabled{background:#e6eef4;color:var(--muted);box-shadow:none}
#boost small{font-weight:500;font-size:.68rem}
#vwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#vc{height:100%;max-width:100%;aspect-ratio:14/18;border-radius:14px;border:2px solid var(--ink);image-rendering:auto;background:#7cd05c;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;max-width:92%;text-align:center}
#toast.on{opacity:1}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;padding:2px 0 calc(8px + env(safe-area-inset-bottom,0px))}
#pad button{border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:22px;border-bottom:3px solid var(--line);touch-action:none}
#pad button:active{background:var(--sun)}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#pad .hint{grid-column:1;grid-row:1;font-size:.7rem;color:var(--muted);align-self:center;text-align:center;line-height:1.1}
#pad .menu{grid-column:3;grid-row:1;font-size:1rem}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--sky);background-image:linear-gradient(var(--sky-top),var(--sky) 420px);z-index:40;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.on{display:flex}
.screen>*{width:100%;max-width:480px;margin-left:auto;margin-right:auto}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 0}
.sbar h2{font-size:1.1rem;flex:1}
.sbar .back{border:0;border-radius:10px;background:#fff;color:var(--ink);padding:8px 12px;font:600 .85rem var(--body);border-bottom:3px solid var(--line)}
.sbar .res2{font:700 .9rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:30px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 3px 0 rgba(20,48,74,.07)}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--good);color:#fff;font:600 .9rem/1.2 var(--body);box-shadow:0 3px 0 var(--good-deep);display:inline-flex;flex-direction:column;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.btn small{font-weight:500;font-size:.74rem;opacity:.92}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-deep)}
.btn.red{background:#d8452f;box-shadow:0 3px 0 #8d2616}
.btn:disabled{background:#d5e3ec;color:var(--muted);box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.bar2{height:7px;background:#dbe8f1;border-radius:4px;overflow:hidden;margin-top:5px}
.bar2 i{display:block;height:100%;width:0;background:var(--sun-deep);transition:width .3s}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(20,48,74,.35)}
.sheet.on{display:flex}
.sheet .pn{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto}
.pn h3{font-size:1.15rem}
.pn .btns{display:flex;gap:8px;flex-wrap:wrap}
.pn .btns .btn{flex:1;min-width:120px}
.pn .msg{margin:0;font-size:.85rem;color:var(--muted)}

/* Schacht */
.shaft{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:46px}
.liftcol{position:absolute;left:4px;top:0;bottom:0;width:34px;border-radius:17px;background:repeating-linear-gradient(#b7d4e6 0 8px,#cfe3ef 8px 16px);border:2px solid var(--ink)}
.car{position:absolute;left:1px;width:28px;height:28px;font-size:20px;line-height:28px;text-align:center;background:var(--sun);border-radius:8px;border:2px solid var(--ink);animation:lift 5s ease-in-out infinite alternate}
@keyframes lift{from{top:calc(100% - 32px)}to{top:2px}}
.floor{display:flex;flex-direction:column;gap:8px}
.fh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fname{font:700 1rem var(--display)}
.flv{font:600 .72rem var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--sun-ink);background:var(--sun);border-radius:6px;padding:1px 6px}
.fcps{margin-left:auto;color:var(--good);font:600 .85rem var(--body);font-variant-numeric:tabular-nums}
.stock{font:600 .78rem var(--body);color:var(--muted);background:#eef5fa;border-radius:6px;padding:1px 6px}
.scene{position:relative;height:178px;border-radius:12px;overflow:hidden;background:linear-gradient(var(--s1),var(--s2) 62%)}
.ground{position:absolute;inset:auto 0 0 0;height:44%;background:var(--g);border-top:2px solid rgba(0,0,0,.08)}
.mon{position:absolute}.mon img{display:block;image-rendering:pixelated;will-change:transform}
.pl{left:7%;bottom:10px}.pl img{width:116px;height:116px}
.en{right:8%;bottom:44px}.en img{width:92px;height:92px}
.sh{position:absolute;left:50%;bottom:-2px;width:80%;height:14px;margin-left:-40%;border-radius:50%;background:rgba(0,0,0,.18);z-index:-1}
.plate{position:absolute;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:4px 8px;width:46%;max-width:190px;z-index:2}
.plate.e{left:8px;top:8px}.plate.p{right:8px;bottom:8px}
.plate b{font:600 .78rem var(--body);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:6px;background:#d5e3ec;border-radius:3px;overflow:hidden;margin-top:3px}
.hp i{display:block;height:100%;width:100%;background:var(--hp);transition:width .22s,background .22s}
.hp i.low{background:var(--hp-low)}
.fx{position:absolute;font:700 1rem var(--display);pointer-events:none;z-index:3;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;white-space:nowrap}
.fx.d{color:var(--bad)}.fx.c{color:#9a6a00;font-size:1.1rem}
.ff{display:flex;align-items:center;gap:12px}
.evo{flex:1;min-width:0}.evo .t{font-size:.78rem;color:var(--muted)}
.locked{border:2px dashed #8fb9d3;background:rgba(255,255,255,.6);box-shadow:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;color:var(--ink);font:600 .85rem var(--body);padding:8px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* Einheiten / Team */
.unit img{width:64px;height:64px;image-rendering:pixelated;flex:none}
.unit b{font-family:var(--display)}
.tag{font:600 .68rem var(--body);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 6px;background:#eef5fa;color:var(--muted)}
.tag.on{background:var(--sun);color:var(--sun-ink)}

/* Raid */
#rc{width:100%;max-height:100%;aspect-ratio:14/16;border-radius:14px;border:2px solid var(--ink);background:#7cd05c;touch-action:none;image-rendering:auto}
.queue{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.queue .chip{width:48px;height:48px;border-radius:12px;background:#fff;border:2px solid var(--line);display:grid;place-items:center}
.queue .chip.next{border-color:var(--sun-deep);background:#fff4cc}
.queue .chip.used{opacity:.3}
.queue img{width:40px;height:40px;image-rendering:pixelated}

/* Höhle */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.door{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 .9rem var(--body);color:var(--ink);box-shadow:0 3px 0 rgba(20,48,74,.07)}
.door:active{background:#fff4cc}
.door .e{font-size:2rem}.door small{color:var(--muted);font-weight:500;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:.78rem}
.chip2 img{width:40px;height:40px;image-rendering:pixelated}
.mini{width:46px}
.log{min-height:44px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.car{animation:none;top:50%}.hp i{transition:none}}
</style>

<div id="app">
  <header class="hud" id="hud">
    <div class="res">
      <div><span id="rGold">0</span><small id="rRate">0/s</small></div>
      <div><span id="rBer">0</span><small>🍓 Beeren</small></div>
      <div><span id="rDust">0</span><small>💎 Sternenstaub</small></div>
    </div>
    <button id="boost"><span id="bl1">☀ Boost</span><small id="bl2">×2 Schacht</small></button>
  </header>
  <div id="vwrap"><canvas id="vc"></canvas><div id="toast"></div></div>
  <div id="pad">
    <span class="hint">Geh zu einem Gebäude</span>
    <button id="up" aria-label="hoch">▲</button><button id="left" aria-label="links">◀</button><button id="down" aria-label="runter">▼</button><button id="right" aria-label="rechts">▶</button>
    <button class="menu" id="menuBtn" aria-label="Team">👥</button>
  </div>
</div>

<!-- Schacht -->
<section class="screen" id="sc_shaft">
  <div class="sbar"><button class="back" data-back>‹ Dorf</button><h2>Kampfschacht</h2><span class="res2" id="shGold"></span></div>
  <div class="scroll">
    <div class="card"><div class="row">
      <div class="grow"><b>Aufzug <span id="liftLv"></span></b><p class="sub" id="liftSub"></p><div class="bar2"><i id="stockBar"></i></div></div>
      <button class="btn" id="liftBuy"></button>
    </div></div>
    <div class="row" style="justify-content:space-between"><h3 style="font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500">Arenen</h3>
      <div class="seg" id="seg"><button data-m="1" aria-pressed="true">×1</button><button data-m="10" aria-pressed="false">×10</button><button data-m="max" aria-pressed="false">Max</button></div></div>
    <div class="shaft" id="shFloors"><div class="liftcol"><div class="car" id="car">📦</div></div></div>
  </div>
</section>

<!-- Team -->
<section class="screen" id="sc_team">
  <div class="sbar"><button class="back" data-back>‹ Dorf</button><h2>Deine Pokémon</h2><span class="res2" id="tmBer"></span></div>
  <div class="scroll" id="tmList"></div>
</section>

<!-- Raid -->
<section class="screen" id="sc_raid">
  <div class="sbar"><button class="back" data-back id="raidBack">‹ Dorf</button><h2 id="raidTitle">Raid-Tor</h2><span class="res2" id="raidTro"></span></div>
  <div class="scroll" id="raidList"></div>
  <div id="raidBattle" style="display:none;flex:1;min-height:0;flex-direction:column;align-items:center">
    <div class="row" style="justify-content:space-between;width:100%;padding-bottom:6px"><b id="raidInfo" class="num"></b><button class="ghost" id="raidFlee">Aufgeben</button></div>
    <canvas id="rc"></canvas>
    <div class="queue" id="queue"></div>
    <p class="sub" style="text-align:center">Tippe auf das Spielfeld (unten), um das nächste Pokémon zu rufen.</p>
  </div>
</section>

<!-- Höhle -->
<section class="screen" id="sc_cave">
  <div class="sbar"><button class="back" data-back id="caveBack">‹ Dorf</button><h2>Wirrwarr-Höhle</h2><span class="res2" id="caveDust"></span></div>
  <div class="scroll" id="caveBody"></div>
</section>

<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

const fmt=v=>{
  if(v<1000)return v<10&&v%1?v.toLocaleString('de-DE',{maximumFractionDigits:1}):Math.floor(v).toLocaleString('de-DE');
  const u=['K','Mio','Mrd','Bio','Brd'];let k=-1;
  while(v>=1000&&k<u.length-1){v/=1000;k++}
  return v.toLocaleString('de-DE',{maximumFractionDigits:v<10?2:v<100?1:0})+' '+u[k];
};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const imgs={};const img=src=>imgs[src]||(imgs[src]=Object.assign(new Image(),{src}));

const ustage=u=>u.l>=15?2:u.l>=6?1:0;
const upow=()=>1+.1*S.meta.pow;
const uHP=u=>Math.round(SP[u.k].hp*(1+.35*(u.l-1))*(1+.4*ustage(u))*upow());
const uATK=u=>Math.round(SP[u.k].atk*(1+.3*(u.l-1))*(1+.4*ustage(u))*upow());
const uFace=u=>SP[u.k].f[ustage(u)];
const uName=u=>NAME[uFace(u)];
const lvCost=u=>Math.ceil(20*Math.pow(u.l,1.6));
const maxLvl=()=>10+6*S.bar.lv;
const rosterCap=()=>4+2*S.bar.lv;
const trainCost=()=>Math.ceil(40*Math.pow(1.45,S.roster.length-1));
const teamUnits=()=>S.team.map(i=>S.roster[i]).filter(Boolean);
function teamScale(){const t=teamUnits();if(!t.length)return 1;return t.reduce((a,u)=>a+(1+.35*(u.l-1))*(1+.4*ustage(u)),0)/t.length*upow()}
function avgLvl(){const t=teamUnits();return t.length?t.reduce((a,u)=>a+u.l,0)/t.length:1}

// ============ Schacht-Rechnung ============
const lvl=i=>S.sh.lv[i];
const stage=i=>lvl(i)>=25?2:lvl(i)>=10?1:0;
const mult=L=>MS.reduce((m,x)=>m*(L>=x?2:1),1);
const reward=i=>FL[i].r*lvl(i)*mult(lvl(i));
const hitMs=i=>Math.max(380,900*Math.pow(.98,lvl(i)-1));
const cycleMs=i=>2.37*hitMs(i)+950;
const boosting=()=>Date.now()<S.boostUntil;
const cpsOf=i=>lvl(i)>0?reward(i)/(cycleMs(i)/1000):0;
const rawCps=()=>FL.reduce((a,_,i)=>a+cpsOf(i),0);
const base=i=>FL[i].B*Math.pow(GR,lvl(i)-1);
const costN=(i,n)=>base(i)*(Math.pow(GR,n)-1)/(GR-1);
const maxN=i=>Math.max(0,Math.floor(Math.log(1+S.gold*(GR-1)/base(i))/Math.log(GR)));
const amount=i=>mode==='max'?Math.max(1,maxN(i)):+mode;
const nextMs=i=>MS.find(x=>x>lvl(i));
const liftCap=()=>25*Math.pow(1.4,S.sh.lift-1);
const liftCost=()=>Math.ceil(60*Math.pow(1.55,S.sh.lift-1));
const stockSum=()=>S.sh.st.reduce((a,b)=>a+b,0);

// ============ Dorf-Rechnung (Baumeister, Farmen) ============
const builders=()=>1+S.meta.bld;
const busy=()=>[S.farms[0],S.farms[1],S.bar].filter(x=>x.b>0).length;
const farmRate=L=>L>0?.45*Math.pow(1.4,L-1):0;
const farmCap=L=>120*Math.pow(1.6,L-1);
const farmCost=L=>L===0?300:Math.ceil(150*Math.pow(2.2,L-1));
const farmTime=L=>15*Math.pow(L+1,1.5)*1000;
const barCost=L=>Math.ceil(400*Math.pow(2.4,L-1));
const barTime=L=>30*Math.pow(L+1,1.5)*1000;
function startBuild(obj,cost,ms){
  if(busy()>=builders()){toast('Alle Baumeister sind beschäftigt.');return false}
  if(S.gold<cost){toast('Zu wenig Münzen.');return false}
  S.gold-=cost;obj.b=Date.now()+ms;dirty=true;toast('Bau gestartet!');return true;
}

// ============ Zeit / Leerlauf ============
function advance(){
  const now=Date.now();let dt=(now-last)/1000;
  if(dt<=0)return 0;
  const from=last;last=now;dt=Math.min(dt,OFF);
  const bo=Math.max(0,Math.min(now,S.boostUntil)-from)/1000;
  const eff=dt+Math.min(bo,dt);
  let any=false;
  FL.forEach((_,i)=>{const p=cpsOf(i)*eff;if(p>0){S.sh.st[i]+=p;any=true}});
  const tot=stockSum();
  if(tot>0){const mv=Math.min(tot,liftCap()/LIFT_T*dt);if(mv>0){const f=mv/tot;S.sh.st=S.sh.st.map(x=>x*(1-f));S.gold+=mv;S.total+=mv;dirty=true}}
  [S.farms[0],S.farms[1]].forEach(f=>{
    let pt=dt;if(f.b)pt-=Math.max(0,Math.min(now,f.b)-from)/1000;
    if(f.lv>0&&pt>0)f.st=Math.min(farmCap(f.lv),f.st+farmRate(f.lv)*pt);
    if(f.b&&now>=f.b){f.b=0;f.lv++;dirty=true;toast('Fertig: Beerenfarm Stufe '+f.lv+'!')}
  });
  if(S.bar.b&&now>=S.bar.b){S.bar.b=0;S.bar.lv++;dirty=true;toast('Fertig: Kaserne Stufe '+S.bar.lv+'!')}
  if(any)dirty=true;
  return dt;
}

// ============ Dorf (Overworld) ============
const vc=$('vc'),vx=vc.getContext('2d');vc.width=MW*TS;vc.height=MH*TS;
const baseC=document.createElement('canvas');baseC.width=vc.width;baseC.height=vc.height;
const grid=[];
function bldAt(x,y){return BLD.find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)}
(function mkMap(){
  const r=rng(7);
  for(let y=0;y<MH;y++){grid.push([]);for(let x=0;x<MW;x++){
    let c='.';
    if(x===0||y===0||x===MW-1||y===MH-1)c='T';
    else if(x>=1&&x<=3&&y>=14&&y<=16)c='w';
    else if((x===6||x===7)&&y>=3&&y<=16)c='p';
    else if([4,8,12,15].includes(y)&&x>=1&&x<=12&&!(y===15&&x<4))c='p';
    else if(r()<.07&&!bldAt(x,y)&&!(x>=5&&x<=8&&y>=8&&y<=10))c='T';
    else if(r()<.08)c='f';
    grid[y].push(c);
  }}
  BLD.forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)if(grid[y][x]==='T'||grid[y][x]==='w')grid[y][x]='.'});
})();
function buildBase(){
  const c=baseC.getContext('2d');c.textBaseline='middle';c.textAlign='center';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=grid[y][x];
    c.fillStyle=(x+y)%2?'#7dd25d':'#76cb57';
    if(t==='p')c.fillStyle='#ecd9a0';if(t==='w')c.fillStyle='#5db6f2';
    c.fillRect(x*TS,y*TS,TS,TS);
    if(t==='w'){c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x*TS+6,y*TS+10,12,2)}
    c.font='26px serif';
    if(t==='T')c.fillText('🌳',x*TS+TS/2,y*TS+TS/2+2);
    if(t==='f'){c.font='14px serif';c.fillText('🌼',x*TS+TS/2,y*TS+TS/2)}
  }
  BLD.forEach(b=>{
    c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.roundRect(b.x*TS+2,b.y*TS+2,b.w*TS-4,b.h*TS-4,10);c.fill();
    c.strokeStyle='rgba(20,48,74,.35)';c.lineWidth=2;c.stroke();
    c.font=Math.min(b.w,b.h)*TS*.78+'px serif';c.fillStyle='#000';c.fillText(b.e,(b.x+b.w/2)*TS,(b.y+b.h/2)*TS-3);
    c.font='700 10px Inter,sans-serif';c.lineWidth=3;c.strokeStyle='#fff';c.fillStyle='#14304a';
    c.strokeText(b.n,(b.x+b.w/2)*TS,(b.y+b.h)*TS-5);c.fillText(b.n,(b.x+b.w/2)*TS,(b.y+b.h)*TS-5);
  });
}
const npcs=[{id:16,x:3,y:9},{id:19,x:11,y:13},{id:25,x:4,y:6}].map(n=>({...n,vx:n.x,vy:n.y}));
setInterval(()=>{if(cur!=='village')return;npcs.forEach(n=>{
  const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)],nx=n.x+d[0],ny=n.y+d[1];
  if(free(nx,ny)&&!(nx===S.px&&ny===S.py))Object.assign(n,{x:nx,y:ny})})},900);
let pvx=S.px,pvy=S.py;
const free=(x,y)=>x>0&&y>0&&x<MW-1&&y<MH-1&&grid[y][x]!=='T'&&grid[y][x]!=='w'&&!bldAt(x,y);
function badgeFor(b){
  if(b.id.startsWith('farm')){const f=S.farms[+b.id[4]];if(f.b)return '🔨';if(f.lv===0)return '➕';if(f.st>=farmCap(f.lv)*.25)return '❗'}
  if(b.id==='bar'&&S.bar.b)return '🔨';
  if(b.id==='shaft'&&stockSum()>liftCap()*3)return '📦';
  return '';
}
function drawVillage(ts){
  if(cur==='village'&&!document.hidden){
    vx.drawImage(baseC,0,0);vx.textAlign='center';vx.textBaseline='middle';
    BLD.forEach(b=>{const bd=badgeFor(b);if(bd){vx.font='18px serif';vx.fillText(bd,(b.x+b.w)*TS-8,b.y*TS+8+Math.sin(ts/300)*2)}});
    npcs.forEach(n=>{n.vx+=(n.x-n.vx)*.15;n.vy+=(n.y-n.vy)*.15;vx.drawImage(img(sprF(n.id)),n.vx*TS-2,n.vy*TS-6,TS+4,TS+4)});
    pvx+=(S.px-pvx)*.35;pvy+=(S.py-pvy)*.35;
    vx.fillStyle='rgba(0,0,0,.18)';vx.beginPath();vx.ellipse(pvx*TS+TS/2,pvy*TS+TS-5,10,4,0,0,7);vx.fill();
    vx.font='26px serif';vx.fillStyle='#000';vx.fillText('🧒',pvx*TS+TS/2,pvy*TS+TS/2-2+Math.sin(ts/180)*1.2);
  }
  requestAnimationFrame(drawVillage);
}
function step(dx,dy){
  if(cur!=='village'||$('sheet').classList.contains('on')||!running)return;
  const nx=S.px+dx,ny=S.py+dy,b=bldAt(nx,ny);
  if(b){openBuilding(b.id);return}
  if(!free(nx,ny))return;
  S.px=nx;S.py=ny;dirty=true;
}
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
for(const k in dirs){
  const b=$(k);let iv;
  b.addEventListener('pointerdown',e=>{e.preventDefault();step(...dirs[k]);clearInterval(iv);iv=setInterval(()=>step(...dirs[k]),150)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(iv)));
}
addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(m)step(...dirs[m])});
// Wischen auf der Karte
let sw=null;
vc.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY}});
vc.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  Math.abs(dx)>Math.abs(dy)?step(dx>0?1:-1,0):step(0,dy>0?1:-1)});

function mkPanel(title,body,onClose){

  if(id==='shaft')return go('shaft');

  if(id==='hall')return openSheet(hallPanel());

function farmPanel(i){
  const f=S.farms[i];
  const el=mkPanel('🍓 Beerenfarm '+(i?'II':''),`<p class="sub" data-s></p><div class="bar2"><i data-bar></i></div>
    <div class="btns"><button class="btn sun" data-c>Einsammeln</button><button class="btn" data-u></button></div><p class="msg" data-m></p>`);
  const q=s=>el.querySelector(s);
  q('[data-c]').addEventListener('click',()=>{const g=Math.floor(f.st);if(g<1)return;S.berries+=g;f.st-=g;dirty=true;toast('+'+fmt(g)+' 🍓 eingesammelt');refresh()});
  q('[data-u]').addEventListener('click',()=>{startBuild(f,farmCost(f.lv),farmTime(f.lv));refresh()});
  function refresh(){
    const now=Date.now();
    if(f.lv===0&&!f.b){q('[data-s]').textContent='Noch nicht gebaut. Hier wachsen Beeren für deine Pokémon.';q('[data-bar]').style.width='0%';q('[data-c]').disabled=true;q('[data-m]').textContent='';}
    else if(f.b){q('[data-s]').textContent=(f.lv?`Stufe ${f.lv} → ${f.lv+1}`:'Wird gebaut')+' · noch '+mmss(f.b-now);const tot=farmTime(f.lv);q('[data-bar]').style.width=(100-(f.b-now)/tot*100)+'%';q('[data-c]').disabled=f.st<1;q('[data-m]').textContent='Baumeister arbeiten. Die Farm liefert währenddessen nichts.'}
    else{q('[data-s]').textContent=`Stufe ${f.lv} · ${fmt(f.st)} / ${fmt(farmCap(f.lv))} 🍓 · +${fmt(farmRate(f.lv)*60)} pro Minute`;q('[data-bar]').style.width=f.st/farmCap(f.lv)*100+'%';q('[data-c]').disabled=f.st<1;q('[data-m]').textContent=''}
    const u=q('[data-u]');u.innerHTML=`<span>${f.lv===0?'Bauen':'Ausbauen'}</span><small>${fmt(farmCost(f.lv))} 🪙 · ${mmss(farmTime(f.lv))}</small>`;
    u.disabled=!!f.b||S.gold<farmCost(f.lv)||busy()>=builders();
  }
  return {el,refresh};
}
function barPanel(){
  const b=S.bar;
  const el=mkPanel('🏕️ Kaserne',`<p class="sub" data-s></p><div class="btns"><button class="btn sun" data-t></button><button class="btn" data-u></button></div><div class="btns"><button class="btn" data-r style="background:#3b7dd8;box-shadow:0 3px 0 #1f4a8c">Meine Pokémon ansehen</button></div><p class="msg" data-m></p>`);
  const q=s=>el.querySelector(s);
  q('[data-t]').addEventListener('click',()=>{
    if(S.roster.length>=rosterCap()||S.berries<trainCost())return;
    S.berries-=trainCost();
    const pool=SK.flatMap(k=>Array(Math.round(SP[k].w*10)).fill(k));const k=pool[Math.floor(Math.random()*pool.length)];
    S.roster.push({k,l:1});if(S.team.length<6)S.team.push(S.roster.length-1);dirty=true;
    toast('Neu: '+NAME[SP[k].f[0]]+'!');refresh();
  });
  q('[data-u]').addEventListener('click',()=>{startBuild(b,barCost(b.lv),barTime(b.lv));refresh()});
  q('[data-r]').addEventListener('click',()=>{closeSheet();go('team')});
  function refresh(){
    const now=Date.now();
    q('[data-s]').textContent=`Stufe ${b.lv} · Platz für ${rosterCap()} Pokémon (${S.roster.length} belegt) · max. Pokémon-Stufe ${maxLvl()}`+(b.b?` · Umbau noch ${mmss(b.b-now)}`:'');
    q('[data-t]').innerHTML=`<span>Pokémon rufen</span><small>${fmt(trainCost())} 🍓</small>`;
    q('[data-t]').disabled=S.roster.length>=rosterCap()||S.berries<trainCost();
    q('[data-u]').innerHTML=`<span>Ausbauen</span><small>${fmt(barCost(b.lv))} 🪙 · ${mmss(barTime(b.lv))}</small>`;
    q('[data-u]').disabled=!!b.b||S.gold<barCost(b.lv)||busy()>=builders();
    q('[data-m]').textContent=S.roster.length>=rosterCap()?'Kaserne voll. Baue sie aus für mehr Platz.':'';
  }
  return {el,refresh};
}

async function floorBattle(i){
  const u=shUI[i],f=FL[i],s=u.s;let lastE=-1;
  while(true){
    if(cur!=='shaft'||document.hidden){await sleep(400);continue}
    const T=hitMs(i)/(boosting()?2:1);
    let id;do{id=f.en[Math.floor(Math.random()*f.en.length)]}while(id===lastE&&f.en.length>1);lastE=id;
    s.eI.src=sprF(id);s.eN.textContent=NAME[id]+' (wild)';setHp(s.eH,100);setHp(s.pH,100);
    s.eI.getAnimations().forEach(a=>a.cancel());
    await anim(s.eI,[{transform:'translateX(120px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:420,fill:'backwards'}).finished.catch(()=>{});
    for(let h=1;h<=3;h++){
      await sleep(T*.25);lunge(s.pI,30);await sleep(T*.12);
      shake(s.eI);setHp(s.eH,100-h*34);fx(s.root,'-'+fmt(Math.max(1,Math.round(reward(i)*(h/3)))),'d','72%','34%');
      if(h<3){await sleep(T*.28);lunge(s.eI,-24);await sleep(T*.1);shake(s.pI);setHp(s.pH,100-h*13);await sleep(T*.25)}
    }
    await anim(s.eI,[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(28px)'}],{duration:450,fill:'forwards'}).finished.catch(()=>{});
    fx(s.root,'+'+fmt(reward(i)*(boosting()?2:1))+' 🪙','c','72%','40%');
    await sleep(500/(boosting()?2:1));
  }
}

let R=null;

const OPPN=[['Bauer Bertrams Hof','Dorf Kornfeld','Hof Sonnenhang','Dorf Mühlbach'],['Händlerlager','Stadt Goldmark','Markt Silberbach','Kupferstadt'],['Festung Eisenfels','Burg Drachenhorst','Zitadelle Nebelwall','Feste Donnerberg']];
function oppInfo(slot){

function renderRaidList(){

function startRaid(slot){
  const o=oppInfo(slot),P=o.P*o.s;
  const blds=[{t:'hall',e:'🏰',x:7,y:2.6,w:2.4,hp:420*P,max:420*P}];
  [[2.5,2.6,'🛖'],[11.5,2.6,'🏚️'],[7,6.2,'⛺']].forEach(([x,y,e])=>blds.push({t:'store',e,x,y,w:1.6,hp:170*P,max:170*P}));
  const dpos=[[4.7,4.6],[9.3,4.6],[2.6,6.4],[11.4,6.4]];
  const defs=[];for(let k=0;k<2+slot;k++){defs.push({id:WILD[Math.floor(o.r()*WILD.length)],x:dpos[k][0],y:dpos[k][1],hp:95*P,max:95*P,atk:9*P,rng:3.4,cd:Math.random(),w:1})}
  const queue=teamUnits().map(u=>({u,face:uFace(u),hp:uHP(u),max:uHP(u),atk:uATK(u),rng:SP[u.k].rng,spd:SP[u.k].spd,cd:0,x:0,y:0,out:false}));
  R={o,blds,defs,queue,units:[],t:0,over:false,proj:[],raf:0,lastTs:0};
  $('raidList').style.display='none';$('raidBattle').style.display='flex';$('raidTitle').textContent=o.name;
  drawQueue();R.raf=requestAnimationFrame(raidFrame);
}
function drawQueue(){
  const q=$('queue');q.innerHTML='';let nextDone=false;
  R.queue.forEach(u=>{const c=mk('div','chip'+(u.out?' used':(!nextDone?' next':'')),`<img src="${sprF(u.face)}" alt="">`);if(!u.out&&!nextDone)nextDone=true;q.appendChild(c)});
}
rc.addEventListener('pointerdown',e=>{
  if(!R||R.over)return;
  const nx=R.queue.find(u=>!u.out);if(!nx)return;
  const r=rc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*14,y=(e.clientY-r.top)/r.height*16;
  nx.x=Math.min(13,Math.max(1,x));nx.y=Math.max(9.5,Math.min(15,y));nx.out=true;R.units.push(nx);drawQueue();
});
const near=(p,arr,maxD=1e9)=>{let b=null,bd=maxD;for(const e of arr){if(e.hp<=0)continue;const d=Math.hypot(e.x-p.x,e.y-p.y)-(e.w||1)/2;if(d<bd){bd=d;b=e}}return b};
function raidFrame(ts){
  if(!R)return;
  const dt=Math.min(.05,(ts-(R.lastTs||ts))/1000);R.lastTs=ts;
  if(!R.over){
    R.t+=dt;
    R.units.forEach(u=>{
      if(u.hp<=0)return;u.cd-=dt;
      const t=near(u,R.defs,2.6)||near(u,R.blds);if(!t)return;
      const d=Math.hypot(t.x-u.x,t.y-u.y)-(t.w||1)/2;
      if(d>u.rng){const a=Math.atan2(t.y-u.y,t.x-u.x);u.x+=Math.cos(a)*u.spd*dt;u.y+=Math.sin(a)*u.spd*dt}
      else if(u.cd<=0){u.cd=1;t.hp-=u.atk;R.proj.push({x1:u.x,y1:u.y,x2:t.x,y2:t.y,t:.18,m:u.rng>2})}
    });
    R.defs.forEach(d=>{
      if(d.hp<=0)return;d.cd-=dt;const t=near(d,R.units,d.rng);
      if(t&&d.cd<=0){d.cd=1.3;t.hp-=d.atk;R.proj.push({x1:d.x,y1:d.y,x2:t.x,y2:t.y,t:.18,m:true})}
    });
    R.proj.forEach(p=>p.t-=dt);R.proj=R.proj.filter(p=>p.t>0);
    const hall=R.blds[0],alive=R.units.some(u=>u.hp>0),left=R.queue.some(u=>!u.out);
    if(hall.hp<=0)endRaid(true);else if((!alive&&!left)||R.t>90)endRaid(false);
    const pct=Math.round(raidPct()*100);$('raidInfo').textContent=`${Math.max(0,Math.ceil(90-R.t))} s · ${pct} % zerstört`;
  }
  drawRaid();
  if(R&&!R.over||(R&&R.over&&R.show))R.raf=requestAnimationFrame(raidFrame);
}
function raidPct(){const tot=R.blds.reduce((a,b)=>a+b.max,0),dmg=R.blds.reduce((a,b)=>a+(b.max-Math.max(0,b.hp)),0);return R.blds[0].hp<=0?1:dmg/tot*.99}
function drawRaid(){

  for(let y=0;y<16;y++)for(let x=0;x<14;x++){c.fillStyle=y<9?((x+y)%2?'#8ccf6a':'#85c963'):((x+y)%2?'#a6dd82':'#9fd77b');c.fillRect(x*32,y*32,32,32)}

  c.textAlign='center';c.textBaseline='middle';
  const bar=(x,y,w,p,col)=>{c.fillStyle='rgba(0,0,0,.35)';c.fillRect(x-w/2,y,w,5);c.fillStyle=col;c.fillRect(x-w/2,y,w*Math.max(0,p),5)};
  R.blds.forEach(b=>{if(b.hp<=0){c.globalAlpha=.4;c.font=b.w*20+'px serif';c.fillText('💥',b.x*32,b.y*32);c.globalAlpha=1;return}
    c.font=b.w*24+'px serif';c.fillText(b.e,b.x*32,b.y*32);bar(b.x*32,b.y*32-b.w*17,34,b.hp/b.max,'#e5483a')});
  R.defs.forEach(d=>{if(d.hp<=0)return;c.drawImage(img(sprF(d.id)),d.x*32-32,d.y*32-34,64,64);bar(d.x*32,d.y*32-38,34,d.hp/d.max,'#e5483a')});
  R.units.forEach(u=>{if(u.hp<=0)return;c.drawImage(img(sprF(u.face)),u.x*32-28,u.y*32-30,56,56);bar(u.x*32,u.y*32-34,32,u.hp/u.max,'#3fbf5f')});

    box.appendChild(d);
  }else if(CV.phase==='fight'){
    CV.scene=mkScene({s:['#6a5a8a','#a79bc4'],g:'#5a4a40'});box.appendChild(CV.scene.root);CV.log=mk('div','log','');box.appendChild(CV.log);
  }
}
function pickRelics(n){const a=[...RELIC];const o=[];while(o.length<n){o.push(a.splice(Math.floor(Math.random()*a.length),1)[0].k)}return o}
async function enterRoom(t){
  if(CV.busy)return;
  if(t==='shrine'){CV.team.forEach(m=>{if(m.hp>0)m.hp=Math.min(m.max,m.hp+m.max*.4)});toast('Das Team fühlt sich besser.');return nextRoom()}
  if(t==='treasure'){CV.phase='relic';CV.relicChoices=pickRelics(3);CV.relicTitle='Ein Schatz! Wähle ein Relikt';return caveRender()}
  CV.phase='fight';CV.busy=true;caveRender();
  const L=avgLvl(),sc=1+.35*(L-1),room=CV.room;
  const kind=t==='boss'?{hp:3.4,atk:1.8,n:1}:t==='elite'?{hp:1.8,atk:1.4,n:1}:{hp:1,atk:1,n:1+(Math.random()<.4?1:0)};
  let won=true;
  for(let k=0;k<kind.n;k++){
    const id=t==='boss'?[149,6,9,65][Math.floor(Math.random()*4)]:WILD[Math.floor(Math.random()*WILD.length)];
    const e={id,hp:Math.round(30*sc*(1+.28*room)*kind.hp),atk:Math.round(8*sc*(1+.18*room)*kind.atk)};e.max=e.hp;
    if(!await caveFight(e,t))return;
  }
  CV.busy=false;
  const dust=1+CV.room+(t==='elite'?2:0)+(t==='boss'?15:0);CV.dust=(CV.dust||0)+dust;
  if(t==='boss')return caveEnd(true);
  CV.phase='relic';CV.relicChoices=pickRelics(t==='elite'?3:2);CV.relicTitle=(t==='elite'?'Elite besiegt!':'Sieg!')+' Wähle ein Relikt';
  CV.team.forEach(m=>{if(m.hp>0)m.hp=Math.min(m.max,m.hp+m.max*.08)});
  if(cur==='cave')caveRender();
}
async function caveFight(e,t){
  const s=CV.scene,r=CV.rel,T=650*Math.pow(.85,r.spd);
  const alive=()=>CV.team.find(m=>m.hp>0);
  s.eI.src=sprF(e.id);s.eN.textContent=NAME[e.id]+(t==='boss'?' (Boss)':t==='elite'?' (Elite)':' (wild)');setHp(s.eH,100);
  let a=alive();s.pI.src=sprB(a.face);s.pN.textContent=NAME[a.face];setHp(s.pH,a.hp/a.max*100);
  CV.log.textContent=`${NAME[e.id]} greift an!`;
  await sleep(700);
  while(e.hp>0){
    if(cur!=='cave'){CV=null;return false}
    a=alive();
    lunge(s.pI,30);await sleep(T*.2);
    const crit=Math.random()<Math.min(.8,.2*r.crit);
    const dmg=Math.max(1,Math.round(a.atk*(1+.2*r.atk)*(.85+Math.random()*.3)*(crit?2:1)));
    e.hp-=dmg;shake(s.eI);setHp(s.eH,e.hp/e.max*100);fx(s.root,(crit?'★ ':'-')+dmg,'d','72%','34%');
    if(r.vamp){a.hp=Math.min(a.max,a.hp+dmg*.12*r.vamp);setHp(s.pH,a.hp/a.max*100)}
    await sleep(T*.3);
    if(e.hp<=0)break;
    lunge(s.eI,-24);await sleep(T*.2);
    const ed=Math.max(1,Math.round(e.atk*(.85+Math.random()*.3)*Math.pow(.85,r.def)));
    a.hp-=ed;shake(s.pI);setHp(s.pH,a.hp/a.max*100);fx(s.root,'-'+ed,'d','24%','60%');
    await sleep(T*.3);
    if(a.hp<=0){
      CV.log.textContent=NAME[a.face]+' ist besiegt!';
      await anim(s.pI,[{opacity:1},{opacity:0,transform:'translateY(24px)'}],{duration:400,fill:'forwards'}).finished.catch(()=>{});
      s.pI.getAnimations().forEach(x=>x.cancel());
      const n=alive();
      if(!n){CV.busy=false;caveEnd(false);return false}
      a=n;s.pI.src=sprB(a.face);s.pN.textContent=NAME[a.face];setHp(s.pH,a.hp/a.max*100);
      await sleep(400);
    }
  }
  CV.log.textContent=NAME[e.id]+' wurde besiegt!';
  await anim(s.eI,[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(28px)'}],{duration:400,fill:'forwards'}).finished.catch(()=>{});
  await sleep(300);return true;
}
function caveEnd(won){
  const d=(CV.dust||0)+(won?10:0);S.dust+=d;if(CV.room>S.best||won)S.best=Math.max(S.best,won?8:CV.room);dirty=true;
  CV.phase=won?'won':'over';CV.msg=`<h3>${won?'🏆 Höhle bezwungen!':'💀 Lauf beendet'}</h3><p class="num">Erreicht: Raum ${Math.min(8,CV.room)} / 8 · <b>+${d} 💎</b></p>`;
  if(cur==='cave')caveOpen();
}

// ============ Anzeige ============
function uiTick(){
  const now=Date.now(),b=boosting();
  $('rGold').textContent=fmt(S.gold)+' 🪙';
  $('rRate').textContent=fmt(Math.min(rawCps()*(b?2:1),liftCap()/LIFT_T))+'/s';
  $('rBer').textContent=fmt(S.berries);$('rDust').textContent=fmt(S.dust);
  $('hud').classList.toggle('boost',b);
  const ready=now>=S.boostReady;$('boost').disabled=!ready&&!b;
  $('bl1').textContent=b?'☀ Boost aktiv':ready?'☀ Boost':'☀ Pause';
  $('bl2').textContent=b?mmss(S.boostUntil-now):ready?'Schacht ×2':'in '+mmss(S.boostReady-now);
  if(panel)panel.refresh();
  if(cur==='shaft')shaftRefresh();
  if(cur==='team')$('tmBer').textContent=fmt(S.berries)+' 🍓';
  if(cur==='cave'&&CV)$('caveDust').textContent=fmt(S.dust)+' 💎';
}
setInterval(()=>{if(!running)return;const dt=advance();if(dt>60){showWelcome(dt)}uiTick()},250);
let offStart=null;
function showWelcome(dt){toast(`Willkommen zurück! ${Math.floor(dt/60)} Min Leerlauf: Schacht und Farmen haben weitergearbeitet.`)}

// ============ Speichern (Browser + Datenbank) ============
let db=null,uid=null,saving=false;
const LK='taschenfarm.save3';
function local(){try{const v=JSON.parse(localStorage.getItem(LK));return v&&v.sh?v:null}catch(e){return null}}
function ref(){return db&&uid?db.collection('data/users/'+uid).doc('save3'):null}
async function persist(force){
  if(!dirty&&!force)return;
  S.t=Date.now();dirty=false;
  const snap=JSON.parse(JSON.stringify(S));
  try{localStorage.setItem(LK,JSON.stringify(snap))}catch(e){}
  const r=ref();if(!r||saving)return;
  saving=true;
  try{await r.set(snap)}catch(e){}
  saving=false;
}
setInterval(()=>persist(false),8000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist(true)});
addEventListener('pagehide',()=>persist(true));
const merge=s=>{const f=fresh();const m=Object.assign(f,s);
  m.sh=Object.assign(f.sh,s.sh||{});m.sh.lv=FL.map((_,i)=>+((s.sh||{}).lv||[])[i]||(i===0?1:0));m.sh.st=FL.map((_,i)=>+((s.sh||{}).st||[])[i]||0);
  m.farms=[0,1].map(i=>Object.assign({lv:i?0:1,st:0,b:0},(s.farms||[])[i]));m.bar=Object.assign({lv:1,b:0},s.bar);
  m.meta=Object.assign({pow:0,bld:0,start:0},s.meta);m.roster=(s.roster&&s.roster.length?s.roster:f.roster).filter(u=>SP[u.k]);
  m.team=(s.team||[0]).filter(i=>m.roster[i]);if(!m.team.length)m.team=[0];return m};

async function boot(){
  buildBase();shaftLayout();uiTick();
  requestAnimationFrame(drawVillage);
  const lc=local();
  try{
    if(window.claude&&claude.use){
      const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
      db=d;uid=u?await u.id():null;
    }
  }catch(e){db=null}
  let remote=null;const r=ref();
  if(r){try{const snap=await Promise.race([r.get(),new Promise((_,j)=>setTimeout(j,4000))]);if(snap.exists)remote=snap.data()}catch(e){}}
  const pick=[lc,remote].filter(Boolean).sort((a,b)=>(b.t||0)-(a.t||0))[0];
  if(pick)S=merge(pick);
  pvx=S.px;pvy=S.py;last=S.t||Date.now();
  rebuildShaft();running=true;
  const dt=advance();if(dt>60)showWelcome(dt);
  uiTick();
}
boot();
</script>
